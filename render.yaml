services:
  - type: web
    name: liang-safety-system
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: liang-safety-db
          property: connectionString

databases:
  - name: liang-safety-db
    databaseName: liang_safety
    user: liang_safety_user